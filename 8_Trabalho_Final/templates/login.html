{% extends 'base.html' %}

{% block title %}Login - Natjus{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-8">
    <div class="bg-white shadow-lg rounded-lg p-8">
        <h2 class="text-2xl font-bold text-gray-900 mb-6">Login</h2>
        
        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                    Email
                </label>
                <input type="email" 
                       id="email" 
                       name="email" 
                       required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                       placeholder="seu@email.com">
            </div>
            
            <div class="mb-6">
                <label for="senha" class="block text-sm font-medium text-gray-700 mb-2">
                    Senha
                </label>
                <input type="password" 
                       id="senha" 
                       name="senha" 
                       required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                       placeholder="Sua senha">
            </div>
            
            <button type="submit" 
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition font-semibold">
                Entrar
            </button>
        </form>
        
        <div class="mt-4 text-center">
            <p class="text-gray-600">
                Não tem uma conta? 
                <a href="{{ url_for('register') }}" class="text-blue-600 hover:text-blue-800 font-medium">
                    Cadastre-se
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
