{% extends 'base.html' %}

{% block title %}{% if usuario %}Editar{% else %}Novo{% endif %} Usuário - Natjus{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-900 mb-6">
        {% if usuario %}Editar Usuário{% else %}Novo Usuário{% endif %}
    </h1>
    
    <div class="bg-white shadow-lg rounded-lg p-8">
        <form method="POST">
            <div class="mb-4">
                <label for="nome" class="block text-sm font-medium text-gray-700 mb-2">
                    Nome completo *
                </label>
                <input type="text" 
                       id="nome" 
                       name="nome" 
                       required
                       value="{{ usuario.nome if usuario else '' }}"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                    Email *
                </label>
                <input type="email" 
                       id="email" 
                       name="email" 
                       required
                       value="{{ usuario.email if usuario else '' }}"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            
            <div class="mb-4">
                <label for="perfil_id" class="block text-sm font-medium text-gray-700 mb-2">
                    Perfil *
                </label>
                <select id="perfil_id" 
                        name="perfil_id" 
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    <option value="">Selecione um perfil</option>
                    {% for perfil in perfis %}
                    <option value="{{ perfil.id }}" {% if usuario and usuario.perfil_id == perfil.id %}selected{% endif %}>
                        {{ perfil.nome }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="mb-6">
                <label for="senha" class="block text-sm font-medium text-gray-700 mb-2">
                    Senha {% if usuario %}(deixe em branco para manter a atual){% else %}*{% endif %}
                </label>
                <input type="password" 
                       id="senha" 
                       name="senha" 
                       {% if not usuario %}required{% endif %}
                       minlength="6"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                       placeholder="{% if usuario %}Deixe em branco para não alterar{% else %}Mínimo 6 caracteres{% endif %}">
            </div>
            
            <div class="flex space-x-4">
                <button type="submit" 
                        class="flex-1 bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition font-semibold">
                    {% if usuario %}Atualizar{% else %}Criar{% endif %} Usuário
                </button>
                <a href="{{ url_for('usuarios') }}" 
                   class="flex-1 bg-gray-200 text-gray-700 py-2 px-4 rounded-lg hover:bg-gray-300 transition font-semibold text-center">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
